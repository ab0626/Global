[project]
name = "gdelt-story-clusters"
version = "0.1.0"
description = "A metadata-only GDELT story clustering experiment"
requires-python = ">=3.10,<3.14"
dependencies = [
    "polars==1.31.0",
    "igraph==0.11.9",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.3",
    "boto3==1.38.46",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.1", "ty==0.0.80"]

[tool.uv]
package = false
exclude-newer = "2026-09-12T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["story_clusters.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
