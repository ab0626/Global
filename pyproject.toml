[project]
name = "global-v0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "igraph>=0.11",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
