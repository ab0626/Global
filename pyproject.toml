[project]
name = "global"
version = "0.1.0"
description = "GDELT story clustering experiments (v0 title/entity embeddings and metadata-only Mentions graphs)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars==1.31.0",
    "igraph==0.11.9",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.3",
    "boto3==1.38.46",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==8.4.1",
    "ruff==0.12.1",
    "ty==0.0.80",
]

[tool.uv]
package = false
exclude-newer = "2026-09-12T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["v0"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["story_clusters.py", "clustering_experiment.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
